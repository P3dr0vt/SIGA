<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GERA - Robótica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/gestao.css" />
  <style>
    .tela-cheia-ativa {
      display: none !important;
    }
    
    body.modo-tela-cheia {
      overflow: hidden;
    }
    
    body.modo-tela-cheia header {
      display: none;
    }
    
    body.modo-tela-cheia #menuLateral {
      display: none;
    }
    
    body.modo-tela-cheia #menuOverlay {
      display: none;
    }
    
    body.modo-tela-cheia .main-content {
      margin-top: 0;
      padding: 0;
      height: 100vh;
      overflow-y: auto;
    }
    
    body.modo-tela-cheia .bloco {
      margin: 0;
      border-radius: 0;
      border-bottom: 1px solid #ddd;
      flex: 1;
    }
    
    body.modo-tela-cheia .main-content {
      padding: 0;
      max-width: 100%;
    }
    
    body.modo-tela-cheia .bloco {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    
    body.modo-tela-cheia .bloco-tabela-wrapper {
      grid-template-columns: 1fr 1fr;
      padding: 12px;
      gap: 12px;
      flex: 1;
    }
    
    body.modo-tela-cheia .bloco-coluna {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    
    body.modo-tela-cheia .col-header-row {
      grid-template-columns: 1fr 1fr 1fr;
    }
    
    body.modo-tela-cheia .dados-rows {
      flex: 1;
      overflow-y: auto;
    }
    
    body.modo-tela-cheia .dado-row {
      grid-template-columns: 1fr 1fr 1fr;
      font-size: 13px;
      padding: 4px 0;
    }
    
    body.modo-tela-cheia .dado-cell {
      font-size: 13px;
      padding: 5px 8px;
    }
    
    body.modo-tela-cheia .col-header {
      padding: 8px 6px;
      font-size: 11px;
    }
    

    .robotica-aviso {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
      background: #fff;
      border-left: 4px solid #1a4a9f;
      padding: 12px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .robotica-linha-livre {
      color: #777;
      font-style: italic;
    }
    .dado-row.clickable {
      cursor: pointer;
    }
    .dado-row.clickable:hover {
      background: #eef4ff;
    }
  </style>
</head>
<body>

  <!-- MENU LATERAL -->
  <div id="menuOverlay" class="menu-overlay" onclick="fecharMenu()"></div>
  <nav id="menuLateral" class="menu-lateral">
    <div class="menu-header">
      <button type="button" class="menu-close-btn" onclick="fecharMenu()" title="Fechar menu"><i class="bi bi-x-lg"></i></button>
    </div>
    <ul class="menu-lista">
      <li class="menu-item-inicio"><a href="../index.html" class="menu-item"><i class="bi bi-house"></i><span>AFONSO GRECO</span></a></li>
      <li class="menu-item-instrutores"><a href="instrutores.html" class="menu-item"><i class="bi bi-person-badge"></i><span>INSTRUTORES</span></a></li>
      <li class="menu-item-salas"><a href="salas.html" class="menu-item"><i class="bi bi-door-open"></i><span>SALAS</span></a></li>
      <li class="menu-item-turmas"><a href="turmas.html" class="menu-item"><i class="bi bi-mortarboard"></i><span>TURMAS</span></a></li>
      <li class="menu-item-robotica"><a href="robotica.html" class="menu-item"><i class="bi bi-robot"></i><span>ROBÓTICA</span></a></li>
      <li class="menu-item-alocacoes"><a href="alocacoes.html" class="menu-item"><i class="bi bi-calendar-check"></i><span>ALOCAÇÕES</span></a></li>
    </ul>
    <div class="menu-footer">
      <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </nav>

  <header class="header">
    <div class="header-logo">
      <img src="../logo-area.png" alt="GERA Logo" class="logo-img">
    </div>

    <div class="header-center">
      <div class="data-display" id="dataDisplay" onclick="abrirDatePicker()" style="cursor: pointer;">
        <i class="bi bi-calendar3"></i>
        <span id="dataAtual">Carregando...</span>
        <i class="bi bi-calendar3"></i>
      </div>
    </div>

    <div class="header-controls">
      <div class="horario-display" style="display: flex; align-items: center; gap: 8px; margin-right: 20px;">
        <span id="horarioAtual" style="font-size: 18px; font-weight: 600; color: #fff;">00:00</span>
      </div>
      <div class="turno-selector-container">
        <button class="btn-turno-selector" onclick="toggleTurnoDropdown()">
          <span id="turnoTextoBotao">Turno: Manhã</span>
          <i class="bi bi-chevron-down"></i>
        </button>
        <div class="turno-dropdown" id="turnoDropdown">
          <div class="turno-option" onclick="selecionarTurno('Manhã')"><i class="bi bi-sun-fill"></i> Manhã</div>
          <div class="turno-option" onclick="selecionarTurno('Tarde')"><i class="bi bi-cloud-sun"></i> Tarde</div>
          <div class="turno-option" onclick="selecionarTurno('Noite')"><i class="bi bi-moon-stars"></i> Noite</div>
        </div>
      </div>
      <button class="btn-icon" id="btnTelaCheia" onclick="ativarTelaCheia()" title="Tela Cheia">
        <i class="bi bi-fullscreen"></i>
      </button>
      <button class="btn-icon" id="btnSairTelaCheia" onclick="sairTelaCheia()" title="Sair Tela Cheia" style="display: none;">
        <i class="bi bi-fullscreen-exit"></i>
      </button>
      <button class="btn-icon" onclick="abrirMenu()" title="Menu"><i class="bi bi-list"></i></button>
    </div>
  </header>

  <main class="main-content">
    <section class="bloco" id="roboticaManha">
      <div class="bloco-header">MANHÃ</div>
      <div class="bloco-tabela-wrapper">
        <div class="bloco-coluna">
          <div class="col-header-row">
            <div class="col-header">INSTRUTOR(A)</div>
            <div class="col-header">SALA</div>
            <div class="col-header">TURMA / DIAS</div>
          </div>
          <div id="roboticaManha-col1" class="dados-rows"></div>
        </div>
      </div>
    </section>

    <section class="bloco" id="roboticaTarde">
      <div class="bloco-header">TARDE</div>
      <div class="bloco-tabela-wrapper">
        <div class="bloco-coluna">
          <div class="col-header-row">
            <div class="col-header">INSTRUTOR(A)</div>
            <div class="col-header">SALA</div>
            <div class="col-header">TURMA / DIAS</div>
          </div>
          <div id="roboticaTarde-col1" class="dados-rows"></div>
        </div>
      </div>
    </section>

    <section class="bloco" id="roboticaNoite">
      <div class="bloco-header">NOITE</div>
      <div class="bloco-tabela-wrapper">
        <div class="bloco-coluna">
          <div class="col-header-row">
            <div class="col-header">INSTRUTOR(A)</div>
            <div class="col-header">SALA</div>
            <div class="col-header">TURMA / DIAS</div>
          </div>
          <div id="roboticaNoite-col1" class="dados-rows"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL SELEÇÃO DE DATA -->
  <div id="modalSelecionarData" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width: 400px;">
      <h2 class="modal-titulo">Selecionar Data</h2>
      <div class="form-group">
        <label>Escolha uma data:</label>
        <input type="date" id="inputDataModal" style="width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px;">
      </div>
      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModalData()">Cancelar</button>
        <button class="btn-concluir" onclick="confirmarDataModal()">CONFIRMAR</button>
      </div>
    </div>
  </div>

  <!-- MODAL ALOCAÇÃO -->
  <div id="modalAlocacao" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-titulo" id="tituloModal">Alocar Sala</h2>
      <input type="hidden" id="idSalaAlocacao">

      <div class="form-group">
        <label>Instrutor</label>
        <select id="selInstrutor"></select>
      </div>
      <div class="form-group">
        <label>Turma</label>
        <select id="selTurma"></select>
      </div>
      <div class="form-group">
        <label>Turno</label>
        <select id="selTurno">
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
          <option value="Noite">Noite</option>
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Data Início</label>
          <input type="date" id="dataInicio">
        </div>
        <div class="form-group">
          <label>Data Fim</label>
          <input type="date" id="dataFim">
        </div>
      </div>

      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModal('modalAlocacao')">Cancelar</button>
        <button class="btn-concluir" onclick="salvarAlocacao()">SALVAR ALOCAÇÃO</button>
      </div>
    </div>
  </div>

    <script>
    function abrirMenu() {
      document.getElementById('menuLateral').classList.add('aberto');
      document.getElementById('menuOverlay').classList.add('aberto');
    }
    function fecharMenu() {
      document.getElementById('menuLateral').classList.remove('aberto');
      document.getElementById('menuOverlay').classList.remove('aberto');
    }
    function logout() {
      localStorage.removeItem('gera_token');
      localStorage.removeItem('gera_usuario');
      window.location.href = '../login.html';
    }
    
    // Destacar página atual no menu
    document.addEventListener('DOMContentLoaded', function() {
      const currentPage = window.location.pathname;
      const menuItems = document.querySelectorAll('.menu-lista li');
      
      menuItems.forEach(item => {
        const link = item.querySelector('a');
        if (link) {
          const href = link.getAttribute('href');
          if (currentPage.includes(href)) {
            link.style.backgroundColor = '#38A77F';
          }
        }
      });
    });
    
    // Funcoes de Tela Cheia
    function ativarTelaCheia() {
      document.body.classList.add('modo-tela-cheia');
      document.getElementById('btnTelaCheia').style.display = 'none';
      document.getElementById('btnSairTelaCheia').style.display = 'flex';
      
      // Ocultar apenas botoes de tela cheia e menu
      const btnMenu = document.querySelector('.header-controls .btn-icon:last-child');
      if (btnMenu) {
        btnMenu.style.display = 'none';
      }
      
      // Adicionar listener para ESC
      document.addEventListener('keydown', sairTelaCheiaPorESC);
    }
    
    function sairTelaCheia() {
      document.body.classList.remove('modo-tela-cheia');
      document.getElementById('btnTelaCheia').style.display = 'flex';
      document.getElementById('btnSairTelaCheia').style.display = 'none';
      
      // Restaurar botao de menu
      const btnMenu = document.querySelector('.header-controls .btn-icon:last-child');
      if (btnMenu) {
        btnMenu.style.display = 'flex';
      }
      
      // Remover listener de ESC
      document.removeEventListener('keydown', sairTelaCheiaPorESC);
    }
    
    function sairTelaCheiaPorESC(e) {
      if (e.key === 'Escape') {
        sairTelaCheia();
      }
    }
  </script>
  <script src="../js/validacao-data-turno.js"></script>
  <script src="../js/robotica.js"></script>
</body>
</html>
