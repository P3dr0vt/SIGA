<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GERA - Salas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/gestao.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .item-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .item-card:hover { border-color: #1a4a9f; background: #f8faff; }
    .icon-lapis { color: #1a4a9f; font-size: 20px; }
    .sala-info { flex: 1; }
    .sala-nome { font-weight: 700; color: #333; }
    .sala-bloco { font-size: 12px; color: #666; }
    
    .modo-remover .item-card:hover { border-color: #dc3545; }
    .btn-remover-item {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #dc3545;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .modo-remover .btn-remover-item { display: flex; }
  </style>
</head>
<body>

  <!-- MENU LATERAL -->
  <div id="menuOverlay" class="menu-overlay" onclick="fecharMenu()"></div>
  <nav id="menuLateral" class="menu-lateral">
    <div class="menu-header">
      <button type="button" class="menu-close-btn" onclick="fecharMenu()" title="Fechar menu"><i class="bi bi-x-lg"></i></button>
    </div>
    <ul class="menu-lista">
      <li class="menu-item-inicio"><a href="../index.html" class="menu-item"><i class="bi bi-house"></i><span>AFONSO GRECO</span></a></li>
      <li class="menu-item-instrutores"><a href="instrutores.html" class="menu-item"><i class="bi bi-person-badge"></i><span>INSTRUTORES</span></a></li>
      <li class="menu-item-salas"><a href="salas.html" class="menu-item"><i class="bi bi-door-open"></i><span>SALAS</span></a></li>
      <li class="menu-item-turmas"><a href="turmas.html" class="menu-item"><i class="bi bi-mortarboard"></i><span>TURMAS</span></a></li>
      <li class="menu-item-robotica"><a href="robotica.html" class="menu-item"><i class="bi bi-robot"></i><span>ROBÓTICA</span></a></li>
      <li class="menu-item-alocacoes"><a href="alocacoes.html" class="menu-item"><i class="bi bi-calendar-check"></i><span>ALOCAÇÕES</span></a></li>
    </ul>
    <div class="menu-footer">
      <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </nav>

  <header class="header">
    <div class="header-logo">
      <img src="../logo-area.png" alt="GERA Logo" class="logo-img">
    </div>

    <div class="header-center">
      <div style="width: 200px;"></div>
    </div>

    <div class="header-controls">
      <button class="btn-icon" onclick="abrirMenu()" title="Menu"><i class="bi bi-list"></i></button>
    </div>
  </header>

  <main class="main-content">
    <div class="abas-container" id="abasContainer">
      <button class="aba-btn ativa" onclick="mudarAba('SALA')">SALAS</button>
      <button class="aba-btn" onclick="mudarAba('LABORATORIO')">LABORATÓRIOS</button>
    </div>

    <div class="mapa-calor-filtros" style="background:#fff; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:15px; display:flex; gap:15px; align-items:center;">
      <div class="form-group" style="margin:0;">
        <label style="font-size:11px;">Filtrar por Dia</label>
        <input type="date" id="filtroMapaData" onchange="renderizar()">
      </div>
      <div class="form-group" style="margin:0;">
        <label style="font-size:11px;">Disponibilidade</label>
        <select id="filtroMapaStatus" onchange="renderizar()">
          <option value="TODOS">Todas</option>
          <option value="LIVRE">Somente Livres</option>
          <option value="OCUPADO">Somente Ocupadas</option>
        </select>
      </div>
    </div>

    <div id="loadingMsg" class="loading-msg">Carregando ambientes...</div>
    <div class="lista-grid" id="listaSalas"></div>

    <!-- Container para o Calendário Embutido -->
    <div id="containerCalendarioEmbutido" class="calendario-embutido" style="display:none;">
      <div class="calendario-header">
        <h3 id="tituloCalendarioEmbutido">Calendário</h3>
        <button class="btn-fechar-calendario" onclick="fecharCalendarioEmbutido()">&times;</button>
      </div>
      <div class="calendario-corpo">
        <div class="calendario-form">
          <input type="hidden" id="idSalaAlocacao">
          <div class="form-group">
            <label>Instrutor</label>
            <select id="selInstrutor"></select>
          </div>
          <div class="form-group">
            <label>Turno</label>
            <select id="selTurno" onchange="filtrarTurmasPorTurno(this.value)">
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
              <option value="Noite">Noite</option>
            </select>
          </div>
          <div class="form-group">
            <label>Turma</label>
            <select id="selTurma" disabled></select>
            <small style="color: #999; font-size: 0.85rem; margin-top: 4px; display: block;">Selecione um turno primeiro</small>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Início</label>
              <input type="date" id="dataInicio">
            </div>
            <div class="form-group">
              <label>Fim</label>
              <input type="date" id="dataFim">
            </div>
          </div>
          <button class="btn-concluir" style="width:100%; margin-top:10px;" onclick="salvarAlocacao()">ALOCAR AGORA</button>
        </div>
        <div class="calendario-visual">
          <div id="calendarioOcupacao"></div>
        </div>
      </div>
    </div>

    <div class="acoes-bar">
      <button class="btn-acao btn-adicionar" onclick="abrirModalAdicionar()">
        <i class="bi bi-plus-lg"></i> Adicionar
      </button>
      <button class="btn-acao btn-remover" id="btnModoRemover" onclick="toggleModoRemover()">
        <i class="bi bi-trash"></i> Remover
      </button>
    </div>
  </main>

  <!-- MODAL ADICIONAR SALA -->
  <div id="modalAdicionar" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-titulo">Nova Sala</h2>
      <div class="form-group">
        <label>Nome da Sala</label>
        <input type="text" id="nomeSala" placeholder="Ex: Sala 201" />
      </div>
      <div class="form-group">
        <label>Bloco</label>
        <select id="blocoSala">
          <option value="A">Bloco A</option>
          <option value="B">Bloco B</option>
          <option value="C">Bloco C</option>
          <option value="ROBOTICA">Robótica</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="tipoSala">
          <option value="SALA">Sala de Aula</option>
          <option value="LABORATORIO">Laboratório</option>
        </select>
      </div>
      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModal('modalAdicionar')">Cancelar</button>
        <button class="btn-concluir" onclick="adicionarSala()">SALVAR</button>
      </div>
    </div>
  </div>

  <!-- MODAL ALOCAÇÃO DIRETA -->
  <div id="modalAlocacao" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width: 450px;">
      <h2 class="modal-titulo" id="tituloAlocacao">Alocar Sala</h2>
      <input type="hidden" id="idSalaAlocacao">
      <div class="form-group">
        <label>Instrutor</label>
        <select id="selInstrutor"></select>
      </div>
      <div class="form-group">
        <label>Turno</label>
        <select id="selTurno" onchange="filtrarTurmasPorTurno(this.value)">
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
          <option value="Noite">Noite</option>
        </select>
      </div>
      <div class="form-group">
        <label>Turma</label>
        <select id="selTurma" disabled></select>
        <small style="color: #999; font-size: 0.85rem; margin-top: 4px; display: block;">Selecione um turno primeiro</small>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Data Início</label>
          <input type="date" id="dataInicio">
        </div>
        <div class="form-group">
          <label>Data Fim</label>
          <input type="date" id="dataFim">
        </div>
      </div>
      <div class="calendario-ocupacao">
        <div class="calendario-info-header">Calendário de Ocupação</div>
        <div id="calendarioOcupacao"></div>
      </div>
      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModal('modalAlocacao')">Cancelar</button>
        <button class="btn-concluir" onclick="salvarAlocacao()">ALOCAR</button>
      </div>
    </div>
  </div>

    <script>
    function abrirMenu() {
      document.getElementById('menuLateral').classList.add('aberto');
      document.getElementById('menuOverlay').classList.add('aberto');
    }
    function fecharMenu() {
      document.getElementById('menuLateral').classList.remove('aberto');
      document.getElementById('menuOverlay').classList.remove('aberto');
    }
    function logout() {
      localStorage.removeItem('gera_token');
      localStorage.removeItem('gera_usuario');
      window.location.href = '../login.html';
    }
    
    // Destacar página atual no menu
    document.addEventListener('DOMContentLoaded', function() {
      const currentPage = window.location.pathname;
      const menuItems = document.querySelectorAll('.menu-lista li');
      
      menuItems.forEach(item => {
        const link = item.querySelector('a');
        if (link) {
          const href = link.getAttribute('href');
          if (currentPage.includes(href)) {
            link.style.backgroundColor = '#38A77F';
          }
        }
      });
    });
  </script>
  <script src="../js/validacao-data-turno.js"></script>
  <script src="../js/salas.js"></script>
</body>
</html>
