<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGA – TV Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #F4F5F7;
      overflow: hidden;
    }

    #tv-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #tv-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 8px;
    }

    /* Esconde scrollbar mas permite scroll */
    #tv-content::-webkit-scrollbar { display: none; }

    /* Rodapé fixo */
    #tv-footer {
      flex-shrink: 0;
      background: #0D3566;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid rgba(255,255,255,0.1);
    }

    /* Indicadores de turno (dots) */
    .tv-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    /* Bloco */
    .bloco-header {
      background: #0D3566;
      border-radius: 6px 6px 0 0;
      padding: 9px 18px;
    }
    .bloco-header span {
      color: white;
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }
    .bloco-body {
      background: white;
      border-radius: 0 0 6px 6px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Células */
    .th-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1E6BB8;
      padding: 9px 14px;
      color: white;
      font-weight: 700;
      font-size: 0.79rem;
      letter-spacing: 0.04em;
    }
    .td-cell {
      padding: 9px 14px;
      background: #F0F0F0;
      color: #333;
      font-size: 0.82rem;
      font-weight: 500;
      border-right: 1px solid #E0E0E0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Transição suave ao trocar turno */
    #tv-blocos {
      transition: opacity 0.3s;
    }
    #tv-blocos.fade-out { opacity: 0; }
    #tv-blocos.fade-in  { opacity: 1; }

    /* Barra de progresso automático */
    #progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(255,255,255,0.5);
      width: 0%;
      transition: width linear;
    }
  </style>
</head>
<body>
  <div id="tv-wrapper">

    <!-- Conteúdo principal -->
    <div id="tv-content">
      <div id="tv-blocos"></div>
    </div>

    <!-- Rodapé -->
    <div id="tv-footer" style="position:relative;">
      <!-- Logo -->
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="36" height="23" viewBox="0 0 36 23" fill="none">
          <rect x="0" y="0" width="36" height="9" rx="2" fill="white"/>
          <rect x="5" y="14" width="31" height="9" rx="2" fill="white"/>
        </svg>
        <div>
          <div style="color:white;font-weight:900;font-size:1.1rem;letter-spacing:0.06em;line-height:1.1;">SIGA</div>
          <div style="color:rgba(255,255,255,0.55);font-size:0.52rem;line-height:1.3;">Sistema Integrado de Gestão de Alocação</div>
        </div>
      </div>

      <!-- Turno + dots -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="color:rgba(255,255,255,0.6);font-size:0.82rem;font-weight:600;">TURNO:</span>
          <span id="tv-turno-label" style="color:white;font-weight:900;font-size:1.05rem;min-width:60px;text-align:left;"></span>
        </div>
        <div style="display:flex;gap:6px;" id="tv-dots">
          <div class="tv-dot" data-idx="0"></div>
          <div class="tv-dot" data-idx="1"></div>
          <div class="tv-dot" data-idx="2"></div>
        </div>
      </div>

      <!-- Navegação -->
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="btn-prev" style="
          background:rgba(255,255,255,0.1);border:none;border-radius:50%;
          width:36px;height:36px;cursor:pointer;
          display:flex;align-items:center;justify-content:center;
          transition:background 0.15s;
        ">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button id="btn-next" style="
          background:rgba(255,255,255,0.15);border:none;border-radius:50%;
          width:36px;height:36px;cursor:pointer;
          display:flex;align-items:center;justify-content:center;
          transition:background 0.15s;
        ">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <a href="dashboard.html" style="
          background:rgba(255,255,255,0.1);border:none;border-radius:6px;
          padding:7px 12px;cursor:pointer;color:rgba(255,255,255,0.6);
          font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-decoration:none;
        ">GESTÃO</a>
      </div>

      <!-- Barra de progresso automático -->
      <div id="progress-bar"></div>
    </div>
  </div>

  <script type="module">
    import API from './js/api.js';

    const TURNOS = ['manha', 'tarde', 'noite'];
    const TURNO_LABEL = { manha: 'Manhã', tarde: 'Tarde', noite: 'Noite' };
    const BLOCOS_ORDEM = ['A', 'B', 'C'];
    const INTERVALO = 20000;

    let _idx = 0;
    let _timer = null;
    let _progTimer = null;

    async function init() {
      await API.init();
      _detectarTurno();
      _renderTudo();
      _bindControles();
      _iniciarAuto();
    }

    function _detectarTurno() {
      const h = new Date().getHours();
      _idx = h >= 6 && h < 12 ? 0 : h >= 12 && h < 18 ? 1 : 2;
    }

    function _renderTudo() {
      _renderBlocos();
      _atualizarRodape();
    }

    function _renderBlocos() {
      const turno = TURNOS[_idx];
      const porBloco = API.getAlocacoesPorBloco(turno);
      const container = document.getElementById('tv-blocos');
      const frag = document.createDocumentFragment();

      BLOCOS_ORDEM.forEach(bloco => {
        const alocs = porBloco[bloco] || [];
        const section = document.createElement('div');
        section.style.marginBottom = '14px';

        const header = document.createElement('div');
        header.className = 'bloco-header';
        header.innerHTML = `<span>BLOCO ${bloco}</span>`;
        section.appendChild(header);

        const corpo = document.createElement('div');
        corpo.className = 'bloco-body';

        const metade = Math.ceil(alocs.length / 2);
        [alocs.slice(0, metade), alocs.slice(metade)].forEach(grupo => {
          const col = document.createElement('div');

          const thead = document.createElement('div');
          thead.style.display = 'grid';
          thead.style.gridTemplateColumns = '1fr 1fr 1fr';
          [['INSTRUTOR (A)',_iconeI()], ['SALA',_iconeS()], ['TURMA',_iconeT()]].forEach(([l,ic]) => {
            const th = document.createElement('div');
            th.className = 'th-cell';
            th.innerHTML = ic + `<span>${l}</span>`;
            thead.appendChild(th);
          });
          col.appendChild(thead);

          if (grupo.length === 0) {
            const vazio = document.createElement('div');
            vazio.style.cssText = 'padding:12px 14px;color:#aaa;font-size:0.78rem;font-style:italic;background:#FAFAFA;';
            vazio.textContent = 'Sem alocações';
            col.appendChild(vazio);
          } else {
            grupo.forEach(a => {
              const row = document.createElement('div');
              row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #E8E8E8;';
              [a.instrutor.nome, a.sala.nome, a.turma.nome].forEach(v => {
                const cell = document.createElement('div');
                cell.className = 'td-cell';
                cell.textContent = v;
                row.appendChild(cell);
              });
              col.appendChild(row);
            });
          }
          corpo.appendChild(col);
        });

        section.appendChild(corpo);
        frag.appendChild(section);
      });

      container.innerHTML = '';
      container.appendChild(frag);
    }

    function _atualizarRodape() {
      document.getElementById('tv-turno-label').textContent = TURNO_LABEL[TURNOS[_idx]];
      document.querySelectorAll('.tv-dot').forEach((d, i) => {
        d.style.background = i === _idx ? 'white' : 'rgba(255,255,255,0.28)';
        d.style.transform = i === _idx ? 'scale(1.3)' : 'scale(1)';
      });
    }

    function _navegar(dir) {
      _idx = (_idx + dir + TURNOS.length) % TURNOS.length;
      _reiniciarAuto();
      _renderTudo();
      document.getElementById('tv-content').scrollTop = 0;
    }

    function _bindControles() {
      document.getElementById('btn-prev').onclick = () => _navegar(-1);
      document.getElementById('btn-next').onclick = () => _navegar(1);

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') _navegar(1);
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   _navegar(-1);
      });

      // Dots clicáveis
      document.querySelectorAll('.tv-dot').forEach(dot => {
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', () => {
          _idx = parseInt(dot.dataset.idx);
          _reiniciarAuto();
          _renderTudo();
        });
      });
    }

    function _iniciarAuto() {
      _timer = setInterval(() => { _idx = (_idx + 1) % TURNOS.length; _renderTudo(); }, INTERVALO);
      _iniciarBarra();
    }

    function _reiniciarAuto() {
      clearInterval(_timer);
      clearTimeout(_progTimer);
      const bar = document.getElementById('progress-bar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      _iniciarAuto();
    }

    function _iniciarBarra() {
      const bar = document.getElementById('progress-bar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bar.style.transition = `width ${INTERVALO}ms linear`;
          bar.style.width = '100%';
        });
      });
    }

    function _iconeI() {
      return `<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`;
    }
    function _iconeS() {
      return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>`;
    }
    function _iconeT() {
      return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>`;
    }

    init();
  </script>
</body>
</html>
