<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGA – Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        'siga-dark': '#0D3566',
        'siga-mid':  '#1E6BB8',
        'siga-btn':  '#2574C2',
        'siga-teal': '#5BAF9E'
      }}}
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    .deco-login {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: auto;
      pointer-events: none;
      overflow: visible;
    }

    .campo-flutuante {
      position: relative;
      width: 100%;
    }
    .campo-flutuante label {
      position: absolute;
      top: -9px;
      left: 14px;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 0 4px;
      pointer-events: none;
    }
    .campo-flutuante input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: 10px;
      color: rgba(255,255,255,0.9);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .campo-flutuante input::placeholder { color: rgba(255,255,255,0.35); }
    .campo-flutuante input:focus { border-color: rgba(255,255,255,0.85); }

    #msg-erro {
      color: #FCA5A5;
      font-size: 0.82rem;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    .btn-entrar {
      width: 100%;
      padding: 15px;
      background: #5BAF9E;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-entrar:hover { background: #4FA08F; }
    .btn-entrar:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div style="
    min-height: 100vh;
    background: #0D3566;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  ">

    <!-- Decoração fundo (barras + arcos inspirados no logo SIGA) -->
    <svg class="deco-login" viewBox="0 0 780 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Barra superior (stroke, análoga à barra de cima do logo SIGA em escala grande) -->
      <rect x="40"  y="195" width="640" height="158" rx="66" stroke="white" stroke-width="24" fill="none" opacity="0.20"/>
      <!-- Barra inferior (stroke, deslocada para a direita igual ao logo SIGA) -->
      <rect x="165" y="450" width="640" height="158" rx="66" stroke="white" stroke-width="24" fill="none" opacity="0.14"/>
      <!-- Arco amplo externo — varre a borda direita de cima a baixo -->
      <path d="M780 -20 C1060 200 1060 700 780 920" stroke="white" stroke-width="58" stroke-linecap="round" fill="none" opacity="0.09"/>
      <!-- Arco interno menor — mais próximo ao conteúdo -->
      <path d="M780 80 C980 260 980 640 780 820" stroke="white" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.07"/>
    </svg>

    <!-- Card de Login -->
    <div style="
      width: 100%;
      max-width: 480px;
      padding: 0 24px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    ">

      <!-- Logo SIGA -->
      <div style="display:flex;align-items:center;gap:14px;">
        <svg width="64" height="42" viewBox="0 0 64 42" fill="none">
          <rect x="0" y="0" width="64" height="16" rx="3.5" fill="white"/>
          <rect x="12" y="26" width="52" height="16" rx="3.5" fill="white"/>
        </svg>
        <span style="color:white;font-weight:900;font-size:2.5rem;letter-spacing:0.06em;">SIGA</span>
      </div>

      <!-- Formulário -->
      <form id="form-login" style="width:100%;display:flex;flex-direction:column;gap:16px;">
        <div class="campo-flutuante">
          <label>E-mail</label>
          <input type="email" id="input-email" placeholder="Digita seu e-mail" autocomplete="email" />
        </div>
        <div class="campo-flutuante">
          <label>Senha</label>
          <input type="password" id="input-senha" placeholder="Digita sua senha" autocomplete="current-password" />
        </div>

        <div id="msg-erro"></div>

        <button type="submit" class="btn-entrar">Entrar</button>
      </form>

      <!-- Logo SENAI -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;">
        <span style="color:white;font-weight:900;font-size:1.4rem;letter-spacing:0.12em;">SENAI</span>
        <span style="color:rgba(255,255,255,0.65);font-size:0.75rem;letter-spacing:0.18em;font-weight:600;">NOVA LIMA</span>
      </div>
    </div>
  </div>

  <script type="module">
    import Auth from './js/auth.js';

    if (Auth.isAutenticado()) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('form-login');
    const msgErro = document.getElementById('msg-erro');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('input-email').value;
      const senha = document.getElementById('input-senha').value;

      if (Auth.login(email, senha)) {
        window.location.href = 'dashboard.html';
      } else {
        msgErro.textContent = 'E-mail ou senha incorretos.';
        setTimeout(() => { msgErro.textContent = ''; }, 3500);
      }
    });
  </script>
</body>
</html>
