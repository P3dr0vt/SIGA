<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GERA - Instrutores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/gestao.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* Estilo mais fiel ao PDF */
    .item-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      border-color: #1a4a9f;
    }
    .item-card i.bi-person-circle {
      font-size: 40px;
      color: #1a4a9f;
    }
    .item-card .nome-instrutor {
      font-weight: 700;
      color: #333;
      text-align: center;
    }
    /* Modo de remoção */
    .modo-remover .item-card:hover {
      border-color: #dc3545;
    }
    .btn-remover-item {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #dc3545;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .modo-remover .btn-remover-item {
      display: flex;
    }
    .btn-acao.ativo {
      background: #666 !important;
    }
  </style>
</head>
<body>

  <!-- MENU LATERAL -->
  <div id="menuOverlay" class="menu-overlay" onclick="fecharMenu()"></div>
  <nav id="menuLateral" class="menu-lateral">
    <div class="menu-header">
      <button type="button" class="menu-close-btn" onclick="fecharMenu()" title="Fechar menu"><i class="bi bi-x-lg"></i></button>
    </div>
    <ul class="menu-lista">
      <li class="menu-item-inicio"><a href="../index.html" class="menu-item"><i class="bi bi-house"></i><span>AFONSO GRECO</span></a></li>
      <li class="menu-item-instrutores"><a href="instrutores.html" class="menu-item"><i class="bi bi-person-badge"></i><span>INSTRUTORES</span></a></li>
      <li class="menu-item-salas"><a href="salas.html" class="menu-item"><i class="bi bi-door-open"></i><span>SALAS</span></a></li>
      <li class="menu-item-turmas"><a href="turmas.html" class="menu-item"><i class="bi bi-mortarboard"></i><span>TURMAS</span></a></li>
      <li class="menu-item-robotica"><a href="robotica.html" class="menu-item"><i class="bi bi-robot"></i><span>ROBÓTICA</span></a></li>
      <li class="menu-item-alocacoes"><a href="alocacoes.html" class="menu-item"><i class="bi bi-calendar-check"></i><span>ALOCAÇÕES</span></a></li>
    </ul>
    <div class="menu-footer">
      <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </nav>

  <header class="header">
    <div class="header-logo">
      <img src="../logo-area.png" alt="GERA Logo" class="logo-img">
    </div>

    <div class="header-center">
      <div style="width: 200px;"></div>
    </div>

    <div class="header-controls">
      <button class="btn-icon" onclick="abrirMenu()" title="Menu"><i class="bi bi-list"></i></button>
    </div>
  </header>

  <main class="main-content">
    <div id="loadingMsg" class="loading-msg">Carregando instrutores...</div>
    <div class="lista-grid" id="listaInstrutores"></div>

    <div class="acoes-bar">
      <button class="btn-acao btn-adicionar" onclick="abrirModalAdicionar()">
        <i class="bi bi-plus-lg"></i> Adicionar
      </button>
      <button class="btn-acao btn-remover" id="btnModoRemover" onclick="toggleModoRemover()">
        <i class="bi bi-trash"></i> Remover
      </button>
    </div>
  </main>

  <!-- MODAL ADICIONAR -->
  <div id="modalAdicionar" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-titulo">Novo Instrutor</h2>
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nomeInstrutor" placeholder="Ex: Alexandre Silva" />
      </div>
      <div class="form-group">
        <label>Matrícula</label>
        <input type="text" id="matriculaInstrutor" placeholder="Ex: 20240001" />
        <small style="color:#666; font-size:0.85rem;">A matrícula será usada como login e senha inicial.</small>
      </div>
      <div id="modalErro" class="modal-erro" style="display:none;"></div>
      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModal('modalAdicionar')">Cancelar</button>
        <button class="btn-concluir" onclick="adicionarInstrutor()">SALVAR</button>
      </div>
    </div>
  </div>

    <script>
    function abrirMenu() {
      document.getElementById('menuLateral').classList.add('aberto');
      document.getElementById('menuOverlay').classList.add('aberto');
    }
    function fecharMenu() {
      document.getElementById('menuLateral').classList.remove('aberto');
      document.getElementById('menuOverlay').classList.remove('aberto');
    }
    function logout() {
      localStorage.removeItem('gera_token');
      localStorage.removeItem('gera_usuario');
      window.location.href = '../login.html';
    }
    
    // Destacar página atual no menu
    document.addEventListener('DOMContentLoaded', function() {
      const currentPage = window.location.pathname;
      const menuItems = document.querySelectorAll('.menu-lista li');
      
      menuItems.forEach(item => {
        const link = item.querySelector('a');
        if (link) {
          const href = link.getAttribute('href');
          if (currentPage.includes(href)) {
            link.style.backgroundColor = '#38A77F';
          }
        }
      });
    });
  </script>
  <script src="../js/instrutores.js"></script>
</body>
</html>
