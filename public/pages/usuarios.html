<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GERA - Gestão de Usuários</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/gestao.css" />
  <style>
    .usuarios-cabecalho { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .usuarios-cabecalho h1 { color:#1a4a9f; font-size:24px; }
    .usuarios-lista { display:grid; gap:12px; }
    .usuario-card { background:#fff; border:1px solid #dfe4ee; border-radius:10px; padding:16px; display:flex; justify-content:space-between; align-items:center; gap:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .usuario-dados { min-width:0; }
    .usuario-nome { color:#25324b; font-weight:700; }
    .usuario-email { color:#667085; font-size:14px; overflow-wrap:anywhere; }
    .usuario-status { color:#267a55; font-size:12px; margin-top:5px; }
    .btn-secundario { border:1px solid #1a4a9f; background:#fff; color:#1a4a9f; border-radius:8px; cursor:pointer; font-weight:600; padding:9px 12px; }
    .credencial { background:#f4f7fb; border:1px solid #d0d8e8; border-radius:8px; padding:12px; overflow-wrap:anywhere; }
    .aviso { color:#8a5b00; font-size:13px; }
    @media (max-width:600px) { .usuarios-cabecalho,.usuario-card { align-items:stretch; flex-direction:column; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-logo">
      <a href="../index.html" class="btn-voltar" aria-label="Voltar"><i class="bi bi-arrow-left"></i></a>
      <span class="page-title"><i class="bi bi-shield-lock"></i> USUÁRIOS</span>
    </div>
    <button class="btn-acao btn-adicionar" type="button" onclick="abrirCadastro()"><i class="bi bi-person-plus"></i> Novo administrador</button>
  </header>

  <main class="main-content">
    <div class="usuarios-cabecalho">
      <h1>Usuários do sistema</h1>
      <span>Administradores e contas de exibição</span>
    </div>
    <div id="mensagemLista" class="loading-msg">Carregando usuários...</div>
    <div id="listaUsuarios" class="usuarios-lista"></div>
  </main>

  <div id="modalCadastro" class="modal-overlay" style="display:none;">
    <form class="modal-box" id="formCadastro">
      <h2 class="modal-titulo">Novo administrador</h2>
      <div class="form-group">
        <label for="nomeAdmin">Nome completo</label>
        <input id="nomeAdmin" maxlength="255" autocomplete="name" required />
      </div>
      <div class="form-group">
        <label for="emailAdmin">E-mail</label>
        <input id="emailAdmin" type="email" maxlength="254" autocomplete="email" required />
      </div>
      <p class="aviso">Uma senha temporária segura será exibida apenas uma vez.</p>
      <div id="erroCadastro" class="modal-erro" style="display:none;"></div>
      <div class="modal-acoes">
        <button class="btn-cancelar" type="button" onclick="fecharCadastro()">Cancelar</button>
        <button class="btn-concluir" type="submit">Criar usuário</button>
      </div>
    </form>
  </div>

  <div id="modalCredencial" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-titulo">Credencial temporária</h2>
      <p class="aviso">Copie e entregue por um canal seguro. A senha não será exibida novamente.</p>
      <div class="credencial"><strong>E-mail:</strong> <span id="credencialEmail"></span></div>
      <div class="credencial"><strong>Senha:</strong> <span id="credencialSenha"></span></div>
      <div class="modal-acoes">
        <button class="btn-concluir" type="button" onclick="fecharCredencial()">Concluir</button>
      </div>
    </div>
  </div>

  <script src="../js/usuarios.js"></script>
</body>
</html>
