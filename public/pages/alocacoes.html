<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GERA - Alocações</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/gestao.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .aloc-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .aloc-info b { color: #1a4a9f; }
    .aloc-datas { font-size: 12px; color: #666; margin-top: 5px; }
    
    .modo-remover .aloc-card { cursor: pointer; border-color: #ffcccc; }
    .modo-remover .aloc-card:hover { background: #fff5f5; }
    .btn-remover-item {
      background: #dc3545;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modo-remover .btn-remover-item { display: flex; }
    
    .conflito-aviso {
      color: #dc3545;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- MENU LATERAL -->
  <div id="menuOverlay" class="menu-overlay" onclick="fecharMenu()"></div>
  <nav id="menuLateral" class="menu-lateral">
    <div class="menu-header">
      <button type="button" class="menu-close-btn" onclick="fecharMenu()" title="Fechar menu"><i class="bi bi-x-lg"></i></button>
    </div>
    <ul class="menu-lista">
      <li class="menu-item-inicio"><a href="../index.html" class="menu-item"><i class="bi bi-house"></i><span>AFONSO GRECO</span></a></li>
      <li class="menu-item-instrutores"><a href="instrutores.html" class="menu-item"><i class="bi bi-person-badge"></i><span>INSTRUTORES</span></a></li>
      <li class="menu-item-salas"><a href="salas.html" class="menu-item"><i class="bi bi-door-open"></i><span>SALAS</span></a></li>
      <li class="menu-item-turmas"><a href="turmas.html" class="menu-item"><i class="bi bi-mortarboard"></i><span>TURMAS</span></a></li>
      <li class="menu-item-robotica"><a href="robotica.html" class="menu-item"><i class="bi bi-robot"></i><span>ROBÓTICA</span></a></li>
      <li class="menu-item-alocacoes"><a href="alocacoes.html" class="menu-item"><i class="bi bi-calendar-check"></i><span>ALOCAÇÕES</span></a></li>
    </ul>
    <div class="menu-footer">
      <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </nav>

  <header class="header">
    <div class="header-logo">
      <img src="../logo-area.png" alt="GERA Logo" class="logo-img">
    </div>

    <div class="header-center">
      <div style="width: 200px;"></div>
    </div>

    <div class="header-controls">
      <button class="btn-icon" onclick="abrirMenu()" title="Menu"><i class="bi bi-list"></i></button>
    </div>
  </header>

  <main class="main-content">
    <div id="listaAlocacoes"></div>

    <div class="acoes-bar">
      <button class="btn-acao btn-remover" id="btnModoRemover" onclick="toggleModoRemover()">
        <i class="bi bi-trash"></i> Remover
      </button>
    </div>
  </main>

  <!-- MODAL TRANSFERÊNCIA DE ALOCAÇÃO -->
  <div id="modalAlocacao" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-titulo">Transferir Alocação</h2>
      
      <div class="form-group">
        <label>Instrutor Destinatário</label>
        <select id="selInstrutor" onchange="validarConflitos()"></select>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Data Início</label>
          <input type="date" id="dataInicio" onchange="validarConflitos()">
        </div>
        <div class="form-group">
          <label>Data Fim</label>
          <input type="date" id="dataFim" onchange="validarConflitos()">
        </div>
      </div>

      <div id="msgConflito" class="conflito-aviso"></div>

      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button class="btn-concluir" id="btnSalvar" onclick="salvarAlocacao()">TRANSFERIR</button>
      </div>
    </div>
  </div>

  <!-- MODAL ACEITAR/REJEITAR TRANSFERÊNCIA -->
  <div id="modalAceitarTransferencia" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-titulo">Aceitar ou Rejeitar Transferência</h2>
      
      <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
        <p style="margin: 0 0 10px 0;"><strong>Instrutor de Origem:</strong> <span id="transferInfoInstrutor"></span></p>
        <p style="margin: 0 0 10px 0;"><strong>Sala:</strong> <span id="transferInfoSala"></span></p>
        <p style="margin: 0 0 10px 0;"><strong>Turno:</strong> <span id="transferInfoTurno"></span></p>
        <p style="margin: 0;"><strong>Período:</strong> <span id="transferInfoPeriodo"></span></p>
      </div>
      
      <div class="form-group">
        <label>Selecione a Turma</label>
        <select id="selTurmaTransferencia" onchange="validarConflitTransferencia()"></select>
      </div>

      <div id="msgConflitTransferencia" class="conflito-aviso"></div>

      <div class="modal-acoes">
        <button class="btn-cancelar" onclick="fecharModalTransferencia()">Cancelar</button>
        <button class="btn-rejeitar" id="btnRejeitar" onclick="rejeitarTransferencia()" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">REJEITAR</button>
        <button class="btn-concluir" id="btnAceitar" onclick="aceitarTransferencia()">ACEITAR</button>
      </div>
    </div>
  </div>

    <script>
    function abrirMenu() {
      document.getElementById('menuLateral').classList.add('aberto');
      document.getElementById('menuOverlay').classList.add('aberto');
    }
    function fecharMenu() {
      document.getElementById('menuLateral').classList.remove('aberto');
      document.getElementById('menuOverlay').classList.remove('aberto');
    }
    function logout() {
      localStorage.removeItem('gera_token');
      localStorage.removeItem('gera_usuario');
      window.location.href = '../login.html';
    }
    
    // Destacar página atual no menu
    document.addEventListener('DOMContentLoaded', function() {
      const currentPage = window.location.pathname;
      const menuItems = document.querySelectorAll('.menu-lista li');
      
      menuItems.forEach(item => {
        const link = item.querySelector('a');
        if (link) {
          const href = link.getAttribute('href');
          if (currentPage.includes(href)) {
            link.style.backgroundColor = '#38A77F';
          }
        }
      });
    });
  </script>
  <script src="../js/alocacoes.js"></script>
</body>
</html>
