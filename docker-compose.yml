version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gera-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env local}
      MYSQL_DATABASE: ${DB_NAME:-siga_db}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/siga_final.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gera-network

  app:
    build: .
    container_name: gera-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env local}
      DB_NAME: ${DB_NAME:-siga_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env local}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    networks:
      - gera-network

  nginx:
    image: nginx:alpine
    container_name: gera-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gera-network

volumes:
  db_data:

networks:
  gera-network:
    driver: bridge
