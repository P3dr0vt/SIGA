version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env local}
      POSTGRES_DB: gera
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/siga_final.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gera -d gera"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gera-network

  app:
    build: .
    container_name: gera-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://gera:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env local}@db:5432/gera
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env local}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    networks:
      - gera-network

  nginx:
    image: nginx:alpine
    container_name: gera-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gera-network

volumes:
  postgres_data:

networks:
  gera-network:
    driver: bridge
